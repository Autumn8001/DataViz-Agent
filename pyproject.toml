[project]
name = "dataviz-agent"
version = "0.1.0"
description = "A production-ready data analysis and visualization agent built with LangGraph."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langchain-openai>=0.1.0",
    "langgraph>=0.1.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "streamlit>=1.30.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "seaborn>=0.12.0",
    "matplotlib>=3.7.0",
    "python-dotenv>=1.0.0",
    "langgraph-checkpoint-postgres>=3.1.0",
    "psycopg>=3.3.4",
    "psycopg-pool>=3.3.1",
]
